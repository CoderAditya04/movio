services:

  backend:
    build: ./backend
    container_name: movio-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
    ports:
      - "8080:8080"
    networks:
      - movio-network

  frontend:
    build: ./frontend
    container_name: movio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - movio-network

networks:
  movio-network:
    driver: bridge